nchor="middle" fill="#242320" font-size="17" font-family="Noto Sans Thai, Tahoma, sans-serif">เตรียมซอสกิมจิ</text></g><g class="flow-step" style="--step:6"><rect x="125.0" y="435" width="280" height="46" rx="12" fill="#FFFDF9" stroke="#D5D2C8"/><text x="265" y="464.0" text-anchor="middle" fill="#242320" font-size="17" font-family="Noto Sans Thai, Tahoma, sans-serif">คลุกซอสกับผักกาดขาว</text></g><g class="flow-step" style="--step:7"><rect x="125.0" y="505" width="280" height="46" rx="12" fill="#FFFDF9" stroke="#D5D2C8"/><text x="265" y="534.0" text-anchor="middle" fill="#242320" font-size="17" font-family="Noto Sans Thai, Tahoma, sans-serif">บรรจุลงภาชนะสะอาด</text></g><g class="flow-step" style="--step:8"><rect x="125.0" y="575" width="280" height="46" rx="12" fill="#FBEFEA" stroke="#B8322A"/><text x="265" y="604.0" text-anchor="middle" fill="#242320" font-size="17" font-family="Noto Sans Thai, Tahoma, sans-serif">หมักกิมจิ</text></g><g class="flow-step" style="--step:9"><path d="M265 661 L405 725 L265 789 L125 725 Z" fill="#FAF0D2" stroke="#C6AC60" stroke-linejoin="round"/>
<text x="265" y="720" text-anchor="middle" fill="#242320" font-size="16" font-family="Noto Sans Thai, Tahoma, sans-serif"><tspan x="265">รสชาติได้ตามต้องการ</tspan><tspan x="265" dy="24">หรือยัง?</tspan></text></g>

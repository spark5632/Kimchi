<g class="flow-step" style="--step:12"><rect x="125" y="937" width="280" height="46" rx="23" fill="#EAF0E6" stroke="#78936C"/><text x="265" y="966" text-anchor="middle" font-size="17" font-family="Noto Sans Thai,Tahoma,sans-serif" fill="#365D3B">เก็บรักษาและรับประทาน</text></g>

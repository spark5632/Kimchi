<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 1030" role="img" aria-labelledby="flowTitle flowDesc">
<title id="flowTitle">กระบวนการทำกิมจิพร้อมจุดตัดสินใจ</title>
<desc id="flowDesc">เริ่มต้น เตรียมวัตถุดิบ ล้างและผ่าผักกาดขาว หมักเกลือ ล้างเกลือและพักให้สะเด็ดน้ำ เตรียมซอส คลุก บรรจุ หมัก ถ้ายังไม่ได้รสชาติให้หมักต่อ ถ้าได้แล้วนำไปแช่เย็นและเก็บรักษา</desc>
<defs><marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#78936C" stroke-width="1.4"/></marker></defs>
